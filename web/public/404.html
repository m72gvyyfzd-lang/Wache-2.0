<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wache 2.0</title>
    <script>
      // GitHub Pages hat kein echtes SPA-Routing — dieser Trick leitet jeden
      // unbekannten Pfad an index.html weiter, das ihn dann per
      // history.replaceState wiederherstellt (react-router übernimmt danach).
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // "/Wache-2.0"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
